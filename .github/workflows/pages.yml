name: Deploy leaderboard

on:
  push:
    branches:
      - main
      - master
    paths:
      - "site/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static leaderboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: latest
          cache: true

      - name: Run tests
        run: pixi run test

      - name: Ensure leaderboard data (committed demo preferred)
        run: |
          # A committed site/data/leaderboard.json (e.g. the two-eval demo from
          # scripts/demo_dashboard.py, which needs codameter) is deployed as-is.
          # Only fall back to a smoke leaderboard if none is committed.
          if [ ! -f site/data/leaderboard.json ]; then
            echo "No committed leaderboard; generating a smoke leaderboard."
            pixi run smoke-eval
            pixi run export-leaderboard --results-dir results --output site/data/leaderboard.json
          else
            echo "Deploying committed leaderboard data as-is."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
