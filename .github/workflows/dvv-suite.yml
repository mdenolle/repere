name: dv/v suite (codameter)

# The dv/v suite is scored by codameter, an optional heavy dependency
# (numpy/scipy/pandas/xarray) declared under the `dvv` extra. The default test
# job skips these tests (pytest.importorskip). This workflow installs the extra
# and actually runs them — scoped to dv/v-relevant changes so it stays cheap.

on:
  pull_request:
    paths:
      - "src/repere_suites/dvv/**"
      - "tests/test_dvv_suite.py"
      - "pyproject.toml"
      - ".github/workflows/dvv-suite.yml"
  push:
    branches: [main]
    paths:
      - "src/repere_suites/dvv/**"
      - "tests/test_dvv_suite.py"
      - "pyproject.toml"
      - ".github/workflows/dvv-suite.yml"
  workflow_dispatch:

jobs:
  dvv:
    name: Run dv/v suite with codameter
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: latest
          cache: true

      - name: Install dv/v extra (codameter, pinned)
        run: pixi run -e full python -m pip install -e . -r requirements-dvv.txt

      - name: Run dv/v suite
        run: pixi run -e full python -m pytest tests/test_dvv_suite.py -v
