name: Sandbox parity (host vs docker)

# ROADMAP P2.2 acceptance criterion:
#   "Plot and code suites pass identically with and without
#    FM_USE_DOCKER_SANDBOX."
#
# This workflow builds the pinned sandbox image locally and runs the
# STA/LTA suite tests twice — once with the host-Python sandbox
# (FM_USE_DOCKER_SANDBOX=0), once with the Docker sandbox
# (FM_USE_DOCKER_SANDBOX=1, FM_SANDBOX_IMAGE pointing at the locally-
# built tag). Both invocations must pass, and the dedicated parity test
# in tests/test_sandbox_parity.py asserts that a deterministic plot
# snippet produces byte-identical artefacts under both backends.

on:
  pull_request:
    paths:
      - 'docker/sandbox.Dockerfile'
      - 'src/frugalmind_suites/sta_lta/sandbox.py'
      - 'src/frugalmind_suites/sta_lta/scorers.py'
      - 'src/frugalmind_suites/sta_lta/recipe.py'
      - 'tests/test_sandbox_parity.py'
      - 'tests/test_sta_lta_suite.py'
      - 'tests/test_canonical_recipe.py'
      - '.github/workflows/sandbox-parity.yml'
  push:
    branches:
      - main
    paths:
      - 'docker/sandbox.Dockerfile'
      - 'src/frugalmind_suites/sta_lta/sandbox.py'
  workflow_dispatch:

concurrency:
  group: sandbox-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: parity (host & docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project + test/geo/plot extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,geo,plot]"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sandbox image (load into local docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sandbox.Dockerfile
          load: true
          tags: frugalmind-sandbox:ci
          # Pull cache from the publish workflow so parity builds don't
          # re-do the slow pip install on every PR.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          docker run --rm frugalmind-sandbox:ci python -c \
            "import obspy, matplotlib, numpy, skimage, yaml; \
             print('obspy', obspy.__version__); \
             print('matplotlib', matplotlib.__version__); \
             print('numpy', numpy.__version__); \
             print('skimage', skimage.__version__)"

      - name: Run sandbox tests (host Python)
        env:
          FM_USE_DOCKER_SANDBOX: "0"
        run: |
          pytest tests/test_canonical_recipe.py tests/test_sta_lta_suite.py \
                 tests/test_sandbox_parity.py -v

      - name: Run sandbox tests (Docker)
        env:
          FM_USE_DOCKER_SANDBOX: "1"
          FM_SANDBOX_IMAGE: "frugalmind-sandbox:ci"
        run: |
          pytest tests/test_canonical_recipe.py tests/test_sta_lta_suite.py \
                 tests/test_sandbox_parity.py -v
