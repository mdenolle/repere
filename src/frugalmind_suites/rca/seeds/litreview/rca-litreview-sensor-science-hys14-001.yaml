# TEMPLATE. Authored by an assistant as a skeleton for co-authors to verify or
# replace. The representative question from the whiteboard ("what science came
# out of a given sensor"). reference_citations is EMPTY on purpose: the
# relevant set must be authored by a person who has read the papers.
schema_version: rca.golden.v0.1
id: rca-litreview-sensor-science-hys14-001
family: litreview
group: 2_litreview
tier: T3_reference
shape: A_text
status: template
difficulty: medium
tags: [sensor-to-papers, hys14, obs, hydrate-ridge]

prompt: |
  What science has been published using the HYS14 broadband ocean-bottom
  seismometer at Southern Hydrate Ridge on the OOI Regional Cabled Array?
  Return the list of papers as a JSON array of corpus document ids, most
  relevant first, and then a two-sentence summary per paper. Only cite
  documents that exist in the corpus you searched.

provenance:
  author: assistant-template
  author_role: skeleton
  created: 2026-09-14
  source: >-
    Corpus: mhemmett/arcada @14294bc catalog/papers.json (142 Zotero
    entries, year-only dates, 141 with DOI, 131 with abstract) and
    catalog/pdf-chunks.json (493 chunks from 18 PDFs). Corpus ids for the
    agent are the aRCADA chunk ids (paper::<doi>). papers.json lists 65
    papers with EARTHSCOPE-OO-HYS14 in linked_instruments, but that field
    is produced by a hard-coded keyword map in scripts/fetch-zotero.py
    (lines 24-71) and includes clearly unrelated papers (e.g. a Global
    Seismographic Network review), so it is NOT the gold set.
  source_ref: "https://github.com/mhemmett/arcada/blob/14294bca45ce5f65fd6541bea68ab40fbc870659/catalog/papers.json"
  source_kind: arcada_paper_index
  notes: >-
    Retrieval is scored by nDCG@k over graded relevance; a grade-0 entry
    (explicit negative) is a paper the keyword map links to HYS14 but that
    does not use it. The answer-text part (summaries) is T4 and is not
    scored here; a companion T4 item can rubric-score it once judges are
    calibrated.

holdout:
  split: validation
  visibility: public
  construction: catalog_perturbed
  leakage_note: >-
    The corpus's own linked_instruments field is a noisy superset; a solver
    that returns it verbatim is penalised by nDCG (65 candidates, most
    irrelevant) once grade-0 negatives are marked. The human gold must not
    equal the keyword-map output.
  canary: null

cutoff_date: "2026-06-04"

corpus_snapshot:
  corpus_id: arcada-paper-index
  snapshot_ref: "14294bca45ce5f65fd6541bea68ab40fbc870659 papers.json sha256 3d9f119612aa948c1a619254bbb5e9cd84125735f7bca1d8bd2abc817622f6b1"
  excluded_ids: []

reference_citations: []

scoring:
  method: retrieval_metrics
  metrics: [ndcg_at_k, recall_at_k]
  reference:
    k: 10

todos:
  - "Co-author (lit): author reference_citations with grades 3/2/1/0 by reading the candidates; start from the 65 keyword-linked entries but expect most to be grade 0; record who graded and on what date in provenance.verification."
  - "Corpus: cutoff_date is set to the aRCADA commit date because papers.json has year-only dates; the design (DESIGN.md §3.2) asks for a rebuilt index with publication dates and an indexed_at field; until then the cutoff is at year granularity."
  - "Corpus: confirm redistribution terms for papers.json (abstracts are publisher text; aRCADA has no data licence)."
  - "Harness: map corpus ids: the frugalmind literature_search tool expects a JSON corpus with id/title/abstract/year/published; write the converter from aRCADA papers.json (scripts/rca_build_corpus.py, TODO)."
