# TEMPLATE. Authored by an assistant as a skeleton for co-authors to verify or
# replace. Nothing in `reference`/`checker.args` is ground truth until a named
# person sets status: verified. See docs/rca/AUTHORING.md.
schema_version: rca.golden.v0.1
id: rca-coding-download-hys14-bhz-001
family: coding
group: 1a_download_processing
tier: T2_execution
shape: B_tool
status: template
difficulty: easy
tags: [fdsn, earthscope, obs, hydrate-ridge, download]

prompt: |
  I need two minutes of the vertical broadband seismometer channel from the
  Hydrate Ridge summit ocean-bottom station HYS14 on the OOI Regional Cabled
  Array, starting at 00:00:00 UTC on 1 March 2019. Write a Python script that
  fetches the data from the right public service, and report the SEED trace
  id, the sampling rate in Hz, and the number of samples you received by
  calling record(trace_id=..., sampling_rate_hz=..., n_samples=...).

provenance:
  author: assistant-template
  author_role: skeleton
  created: 2026-09-14
  source: >-
    EarthScope FDSN station and dataselect services queried on 2026-09-14
    (service.iris.edu now 307-redirects to service.earthscope.org). Station
    metadata: network OO, station HYS14, site name "RSN Hydrate Summit 1-4",
    channel BHZ, CMG-1T, 40 Hz, start 2014-09-07. The 2-minute window was
    downloaded and read with ObsPy 1.5.0 (one trace, 4801 samples).
  source_ref: >-
    https://service.earthscope.org/fdsnws/dataselect/1/query?net=OO&sta=HYS14&loc=--&cha=BHZ&start=2019-03-01T00:00:00&end=2019-03-01T00:02:00
  source_kind: fdsn_station_metadata
  notes: >-
    The plain-language prompt deliberately does not say "OO", "BHZ", "FDSN"
    or "EarthScope": resolving those is the task (group 1a). The three facts
    in checker.args were read from the downloaded fixture, not from memory.

holdout:
  split: validation
  visibility: public
  construction: cross_source_join
  leakage_note: >-
    The answer is not in the aRCADA instrument catalog: it requires resolving
    the station to the FDSN service (not OOI M2M) and executing a fetch. A
    copy-from-catalog solver cannot produce n_samples.
  canary: null

cutoff_date: null

tools:
  allowlist: [python_session, fdsn_get_waveforms, record_submit]
  notes: >-
    Two accepted routes: the script performs the fetch itself (deliverable
    script, network=replay), or the agent calls fdsn_get_waveforms and then
    python_session on the returned file. Both are scored by the same checker.

inputs:
  files: []

task:
  deliverable: script_and_artifact
  artifact_keys: [trace_id, sampling_rate_hz, n_samples]
  required_calls: ["record("]
  forbidden_calls: []

sandbox:
  image: ghcr.io/mdenolle/frugalmind-sandbox:v0.4.0
  image_digest: TODO
  network: replay
  allowlist: [service.earthscope.org, service.iris.edu]
  cassette: cassettes/fdsn_OO.HYS14_BHZ_2019-03-01.yaml
  timeout_s: 120

scoring:
  method: execution_check
  metrics: [pass_fail]
  checker:
    module: frugalmind_suites.rca.checkers
    function: fdsn_records
    args:
      expected:
        trace_id: "OO.HYS14..BHZ"
        sampling_rate_hz: 40.0
        n_samples: 4801
      tolerance_samples: 1
    stage_weights: {code: 0.1, runs: 0.2, correct: 0.7}
  config:
    reference_fixture: OO.HYS14..BHZ.2019-03-01.mseed
    reference_fixture_sha256: 044d474ebf89da827d5b750b8d9491a8635e19d3620a7086a5239eb03d765d58

todos:
  - "Co-author: confirm 'Hydrate Ridge summit OBS HYS14' is the phrasing a real user would use and that HYS14 is the intended station (HYS11/12/13 also exist)."
  - "Co-author: decide whether n_samples must be 4801 (inclusive end sample, as ObsPy returned) or whether 4800 is also accepted; tolerance_samples=1 currently accepts both."
  - "Harness: record the cassette named in sandbox.cassette (see data/public/cassettes/README.md); the sha256 in scoring.config was written by hand from the fixture and must be regenerated by validate.py once the checker reads it."
  - "Harness: pin sandbox.image_digest once the image is rebuilt with obspy >= 1.4.1 and the replay CA certificate."
