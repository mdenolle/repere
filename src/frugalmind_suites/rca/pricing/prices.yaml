# =============================================================================
# FrugalMind RCA frozen price map
# =============================================================================
# Purpose: dollar figures on the leaderboard must stay comparable as provider
# list prices move. Every run records `price_map_version`; a re-run months
# later is priced with the SAME map, not the current price. (Pattern from
# AstaBench's time-invariant cost accounting; see DESIGN.md §6.)
#
# Rules
#   - Rates are USD per 1,000,000 tokens (input, output). Cache-read and
#     cache-write rates are optional; when absent, cache tokens are priced as
#     input tokens (conservative).
#   - `verified: true` requires `source_url`, `source_date`, and a person in
#     `verified_by`. Entries with `verified: false` are placeholders: the
#     cost layer refuses to price a run against them unless
#     `--allow-unverified-prices` is passed, and the leaderboard row is then
#     flagged `cost_unverified`.
#   - `pinned_ids` lists the exact model ids the provider accepts for this
#     card. A run whose model id is not in any card's `pinned_ids` is flagged
#     `model_unpinned` (see rca/cost.py).
#   - Local (Ollama / vLLM) models are priced at 0.0 USD by default, as in
#     config/models.yaml. Alternative cost axes (energy, VRAM floor, tokens,
#     tool calls) are tracked in frugalmind issues #39-#44 and are NOT in
#     this file.
#   - Never edit a rate in place. Bump `version`, add a new dated entry, and
#     keep the old one; old runs reference the old version.
#
# Status of this file: SKELETON. Anthropic rates below come from two written
# sources that DISAGREE on Opus 4.6 (see that entry). Every non-Anthropic
# provider is a TODO. Nothing here has been verified by a person.
# =============================================================================

