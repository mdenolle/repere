# =============================================================================
# Suite provenance — where the canonical truth set is authored.
# =============================================================================
# This file declares the upstream authoring surface for the gaia_data_downloader
# suite. The frozen tasks.yaml in this directory is rebuilt from those issues
# by `scripts/sync_gaia_tasks.py`. Drift between issue state and tasks.yaml is
# caught by the suite's drift test.
# =============================================================================

schema_version: 0.1
suite_id: gaia_data_downloader

source_of_truth:
  type: github_issues
  repo: uw-ssec/gaia-agentic-ai
  label: golden-task
  states_included: [open, closed]
  status_filter: [verified, frozen]   # only these statuses are emitted to JSONL

agent:
  name: gaia-data-downloader
  repo: uw-ssec/rse-plugins
  path: community-plugins/gaia-data-downloader
  notes: |
    The agent under test lives in a third repo. This suite never reads or
    imports the agent's code; it only invokes it via the Inspect AI sandbox.

design_doc:
  repo: uw-ssec/gaia-agentic-ai
  path: project-resources/handoff/golden-suite-design.md

contamination_policy:
  - Public issues never contain literal expected checksums or full file listings.
  - Tasks tagged `contamination_risk: high` default to `visibility: private`.
  - Private partition lives under FM_GAIA_GOLDEN_DIR (gitignored), distributed
    via UW-internal share, never echoed back into LLM prompts.
