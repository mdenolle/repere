# RCA Atlas golden data sets, pinned by commit and SHA-256.
#
# RCA Atlas (coszo-hub/RCA-Atlas) owns these items. Its licence is proprietary,
# so Repère never commits or packages a row: `fetch_atlas()` downloads each
# file at `commit` into $REPERE_EVAL_DATA_DIR/atlas/<commit>/ and refuses any
# file whose hash differs from the one below. This file holds hashes and row
# counts only, which identify a dataset version without reproducing it.
#
# The hashes were computed from a checkout of `commit` on 2026-10-15; the
# routing hash equals the `dataset_sha256` in Atlas's own
# results/2026-10-08-baseline/provenance/routing.json.
#
# `commit` is on Atlas's unmerged `rca-atlas-eval-suite` branch, not on main.
# Replace it with a release tag on Atlas main once one exists.

