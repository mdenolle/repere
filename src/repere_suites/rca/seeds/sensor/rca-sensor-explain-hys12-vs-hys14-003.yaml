    with EH? 200 Hz, SH? 40 Hz, MH? 8 Hz, LH? 1 Hz, site "RSN Hydrate Summit
    1-2", 788 m; HYS14 = CMG-1T (360 s) broadband BH?/HH?/MH?/LH? plus CMG-5T
    accelerometer HN? plus HT1-90-U hydrophone HDH/LDH, plus loc 10 PREST
    pressure and (per sea-water-velocity README) loc 20 VEL3D current meter,
    site "RSN Hydrate Summit 1-4", 773-775 m. chronfix documents HYS14 clock
    drift to +-50 s with 32 resyncs (2022-08 to 2026-05). These facts are
    inputs to the rubric, not the reference text.
