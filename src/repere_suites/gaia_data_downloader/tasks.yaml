# =============================================================================
# GAIA data-downloader golden suite — canonical truth set
# =============================================================================
# Each task below specifies a single coding problem for the
# `gaia-data-downloader` agent: produce a Python script that downloads a
# constrained slice of an upstream geoscience dataset under given CLI
# constraints. The agent's output is a *script*; scoring is by sandboxed
# execution + structural-checksum + trajectory analysis.
#
# Source of truth for task wording lives in GitHub issues on
# `uw-ssec/gaia-agentic-ai` labelled `golden-task` (see provenance.yaml).
# This file is the frozen, hash-pinned snapshot consumed by the eval harness.
# It is rebuilt by `scripts/sync_gaia_tasks.py` from that issue label.
#
# Schema (per task)
#   id                       (required)  stable kebab-case id (gaia-dl-NNN)
#   issue_url                (required)  link back to the authoring issue
#   domain                   (required)  seismic | hydrology | dem | climate | cross
#   difficulty               (required)  easy | medium | hard
#   split                    (required)  validation | test
#                              validation = open development set; ships in git.
#                              test       = held-out set; goldens are private.
#   visibility               (required)  public | private
#                              public  = task wording committed.
#                              private = wording lives under REPERE_GAIA_GOLDEN_DIR.
#   prompt                   (required)  the user message handed to the agent
#   expected_tools           (required)  list of tool/skill names the agent
#                              should reasonably use (for tool-efficiency score).
#   required_cli_args        (required)  CLI flags the generated script must expose.
#   expected_files           (required)  list of {glob, min, max} for structural
#                              checksum scoring. Public tasks NEVER list
#                              byte-equal targets here; that's a private-only field.
#   checksum_strategy        (required)  structural | exact | range
#   data_source_url          (required)  upstream endpoint(s); for documentation
#   timeout_s                (required)  sandbox timeout in seconds
#   contamination_risk       (required)  low | medium | high
#                              high-risk tasks should default to visibility:private
#   cutoff_date              (optional)  YYYY-MM-DD; date past which a
#                              retrieval-augmented agent must not query.
#                              Defaults applied by the loader where omitted.
#   notes                    (optional)  rationale and provenance
#
# Suites filter by split. The REPERE_GAIA_SPLIT env var sets the default.
# Inventory (v0.1):
#   30 tasks total = 25 public/validation + 5 private/test
#   Difficulty: 10 easy / 15 medium / 5 hard
#   Domains:    7 seismic / 7 hydrology / 6 dem / 8 climate / 2 cross
# =============================================================================

schema_version: 0.1

tasks:

  # ---------------------------------------------------------------------------
  # Easy (10) — single source, single variable, single time slice.
  # ---------------------------------------------------------------------------

  - id: gaia-dl-001
    domain: seismic
    difficulty: easy
    split: validation
    visibility: public
    prompt: |
      Download 1 day of vertical-component broadband seismic data
      (channel BHZ, sampling rate >= 20 Hz) for IRIS station IU.ANMO
      on 2024-01-15. Save as MiniSEED. Keep only the requested channel.
    expected_tools: [obspy, fdsn]
    required_cli_args: ["--time-spans", "--output-directory"]
    expected_files:
      - {glob: "out/IU.ANMO.*.BHZ.*.mseed", min: 1, max: 4}
    checksum_strategy: structural
    data_source_url: https://service.iris.edu/fdsnws/dataselect/1/
    timeout_s: 300
    contamination_risk: low
    notes: Smoke test for IRIS FDSN dataselect.

