    difficulty: easy
    split: validation
    visibility: public
    prompt: |
      Download the USGS earthquake catalog for the Pacific Northwest
      (lat 42-49, lon -125 to -116) over the last 30 days, magnitude >= 3.0.
      Save as a single GeoJSON file.
    expected_tools: [libcomcat, requests]
    required_cli_args: ["--time-spans", "--geojson", "--output-directory"]
    expected_files:
      - {glob: "out/usgs_catalog_*.geojson", min: 1, max: 1}
    checksum_strategy: structural
    data_source_url: https://earthquake.usgs.gov/fdsnws/event/1/
    timeout_s: 180
    contamination_risk: low
    notes: USGS Comcat smoke test.

