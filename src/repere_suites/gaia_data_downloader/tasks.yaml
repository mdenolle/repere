    expected_tools: [obspy, fdsn]
    required_cli_args: ["--time-spans", "--output-directory"]
    expected_files:
      - {glob: "out/IU.*.xml", min: 1, max: 2}
    checksum_strategy: structural
    data_source_url: https://service.iris.edu/fdsnws/station/1/
    timeout_s: 180
    contamination_risk: low
    notes: StationXML retrieval.

