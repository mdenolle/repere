author-contributions: >-
  M.D. conceived the evaluation framework — the frugality-first framing against
  quality floors, the scorability spectrum, negative-case discipline,
  skill-conditioned evaluation and the skill-lift quantity, the three-family
  taxonomy, and the secret-seed contamination-control design — designed and
  implemented the software, designed and executed the live evaluation protocol,
  analysed the results and wrote the manuscript.
