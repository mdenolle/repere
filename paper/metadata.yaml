data-availability: >-
  The public validation splits, the live evaluation results underlying Fig. 1
  and Tables 1–2, and the figure source data are available at
  https://github.com/mdenolle/frugalmind. The hidden test splits are available
  as a gated dataset; the generator is public and auditable, and only the master
  seed is withheld, so the truth set can be inspected without disclosing its
  answers (see Methods, "Contamination control").
