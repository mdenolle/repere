# =============================================================================
# FrugalMind model registry
# =============================================================================
# Tier definitions for cost-aware routing. Cost rates are USD per 1K tokens.
# Local models are priced at 0.0 because the marginal monetary cost of an
# Ollama/vLLM call on hardware you already pay for is ~zero; if you want to
# attribute electricity or amortized GPU rental, override at registry-load
# time.
#
# Tiers:
#   - nano:    < 2B params, instant on CPU, weakest reasoning
#   - small:   2-9B params, common open-weight chat models
#   - medium:  9-35B params, stronger reasoning, slower on CPU
#   - big:     35-200B params, top open-weight tier or distilled frontier
#   - cloud:   API-served frontier or near-frontier models
#
# Cost values are recorded as of public list prices when this file was written.
# Re-validate before any benchmark publication; provider list prices change.
# =============================================================================

schema_version: 0.1

models:

  # ---- nano: tiny local models ---------------------------------------------
  - id: qwen2.5:0.5b
    family: qwen2.5
    tier: nano
    size_b: 0.5
    context_window: 32000
