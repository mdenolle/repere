  # AI2's OLMo: the most *transparent* entry in the registry — open weights AND
  # open training data/code, so a leaderboard row can be traced to what the
  # model was actually trained on. That matters for a benchmark whose whole
  # point is evidence over hype (and for reasoning about data contamination).
  #
  # NOTE: OLMo 3 is not published to the Ollama library yet (`olmo3` 404s as of
  # this writing); OLMo 2 7B is. Swap the id to `olmo3:7b` once it lands — the
  # rest of this entry stays valid.
