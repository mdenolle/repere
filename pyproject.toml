[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frugalmind"
version = "0.3.0"
description = "Cost-optimized multi-agent evaluation and routing prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
geo = [
    "obspy>=1.4",
]
plot = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scikit-image>=0.22",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
eval = [
    # InspectAI is the substrate for `inspect eval frugalmind/...` and the
    # `inspect view` log inspector. Optional so contributors who don't run
    # benchmarks don't pull it in.
    "inspect_ai>=0.3.50",
]

[project.scripts]
frugalmind = "frugalmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"frugalmind_suites.sta_lta" = [
    "events.yaml",
    "data/golden/.gitkeep",
    "judge_prompts/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length is enforced by formatter
]
