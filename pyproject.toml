[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repere"
version = "0.4.0"
description = "Cost-optimized multi-agent evaluation and routing prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
geo = [
    "obspy>=1.4",
]
dvv = [
    # Scoring backend: regenerates the hidden synthetic and runs the pipeline.
    # Pinned to the *commit* behind codameter v0.3.0 (adds the hideable golden
    # set + renames this suite's dataset_id from dvv_processing to codameter).
    # A git tag is movable and would silently change scores, so we pin the
    # immutable SHA and name the release here for humans. Bump both when
    # codameter cuts a new benchmark.
    "codameter @ git+https://github.com/Denolle-Lab/codameter.git@9c3259b982ad79b35fb5e85cc8fb0952dc09244a",  # v0.3.0
]
plot = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scikit-image>=0.22",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
rca = [
    # RCA suite: JSON-Schema validation of golden records (validate.py) and
    # the numpy-backed T1 clock oracle. Inspect itself comes from [eval].
    "jsonschema>=4.20",
    "numpy>=1.26",
]
eval = [
    # InspectAI is the substrate for `inspect eval repere/...` and the
    # `inspect view` log inspector. Optional so contributors who don't run
    # benchmarks don't pull it in.
    "inspect_ai>=0.3.50",
]

[project.scripts]
repere = "repere.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repere_suites.sta_lta" = [
    "events.yaml",
    "data/golden/.gitkeep",
    "judge_prompts/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length is enforced by formatter
]
